# ============================================================
# Nginx Virtual Host: books.labschool.xyz
# FlipLabs — Self-Hosted FlipHTML5 3D Book Viewer & Bookcase
# Reverse Proxy to Podman Container fliplabs-prod (127.0.0.1:8090)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name books.labschool.xyz;

    ssl_certificate     /etc/ssl/certs/s.labschool.sch.id.crt;
    ssl_certificate_key /etc/ssl/certs/s.labschool.sch.id.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 150M;

    # Cloudflare Real IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/books.labschool.xyz.access.log;
    error_log  /var/log/nginx/books.labschool.xyz.error.log warn;

    # Allow Iframe Embedding inside Labschool Ecosystem
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self' *.labschool.xyz *.labschool.sch.id *.elabschool.net *.elabschool.sch.id localhost:*;" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 512;

    # Cache WebP Book Pages & Assets
    location ~* \.(webp|jpg|jpeg|png|gif|ico|svg|mp3|woff2)$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
